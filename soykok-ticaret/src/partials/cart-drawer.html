<!-- ================= MİNİ SEPET (SAĞDAN AÇILIR) ================= -->
<div id="cartOverlay" class="fixed inset-0 z-50 hidden bg-black/50"></div>

<aside id="cartDrawer"
       class="fixed inset-y-0 right-0 z-50 flex w-full max-w-md translate-x-full flex-col bg-white shadow-2xl transition-transform duration-300"
       role="dialog" aria-modal="true" aria-labelledby="cartDrawerTitle" inert>

  <div class="flex items-center justify-between border-b border-gray-200 px-5 py-4">
    <h2 id="cartDrawerTitle" class="flex items-center gap-2 text-base font-bold">
      <i data-lucide="shopping-cart" class="size-5"></i>
      Sepetim <span class="text-sm font-medium text-gray-500">(<span data-cart-title-count>0</span>)</span>
    </h2>
    <button type="button" data-cart-close class="grid size-9 place-items-center rounded-md hover:bg-gray-100" aria-label="Sepeti kapat">
      <i data-lucide="x" class="size-5"></i>
    </button>
  </div>

  <!-- Ücretsiz kargo ilerlemesi -->
  <div data-cart-progress hidden class="border-b border-gray-100 bg-gray-50 px-5 py-3"></div>

  <!-- Ürünler -->
  <ul data-cart-items hidden class="flex-1 divide-y divide-gray-100 overflow-y-auto px-5"></ul>

  <!-- Boş sepet -->
  <div data-cart-empty class="flex flex-1 flex-col items-center justify-center px-8 text-center">
    <span class="grid size-16 place-items-center rounded-full bg-gray-100 text-gray-400">
      <i data-lucide="shopping-cart" class="size-7"></i>
    </span>
    <p class="mt-4 text-sm font-semibold">Sepetiniz boş</p>
    <p class="mt-1 text-xs text-gray-500">Beğendiğiniz ürünleri sepete ekleyerek alışverişe başlayın.</p>
    <button type="button" data-cart-dismiss class="mt-5 h-10 rounded bg-brand-900 px-5 text-xs font-semibold text-white transition hover:bg-brand-700">
      Alışverişe Başla
    </button>
  </div>

  <!-- Özet -->
  <div data-cart-footer hidden class="border-t border-gray-200 px-5 py-4">
    <dl class="space-y-1.5 text-xs">
      <div class="flex justify-between"><dt class="text-gray-600">Ara Toplam</dt><dd data-cart-subtotal class="font-semibold">0 TL</dd></div>
      <div class="flex justify-between"><dt class="text-gray-600">Kargo</dt><dd data-cart-shipping class="font-semibold">0 TL</dd></div>
      <div class="flex justify-between border-t border-gray-100 pt-2 text-sm"><dt class="font-semibold">Toplam</dt><dd data-cart-total class="font-bold">0 TL</dd></div>
    </dl>
    <a href="/sepet.html" class="mt-4 flex h-11 items-center justify-center gap-2 rounded bg-brand-900 text-sm font-semibold text-white transition hover:bg-brand-700">
      Sepete Git <i data-lucide="arrow-right" class="size-4"></i>
    </a>
    <button type="button" data-cart-dismiss class="mt-2 h-10 w-full rounded text-xs font-medium text-gray-600 hover:bg-gray-100">
      Alışverişe Devam Et
    </button>
  </div>
</aside>
<!-- ================= /MİNİ SEPET ================= -->
