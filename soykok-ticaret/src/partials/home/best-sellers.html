<!-- ================= ÇOK SATANLAR ================= -->
<section id="cok-satanlar" class="container-site scroll-mt-28 py-10" aria-labelledby="bestTitle">
  <div data-product-slider="populer" data-limit="10" data-autoplay="4500">

    <div class="mb-4 flex items-end justify-between gap-4">
      <div>
        <span class="inline-flex items-center gap-1.5 rounded-full bg-amber-100 px-3 py-0.5 text-xs font-semibold text-amber-800">
          <i data-lucide="star" class="size-3.5"></i> En Çok Tercih Edilenler
        </span>
        <h2 id="bestTitle" class="mt-2 text-xl font-bold md:text-2xl">Çok Satanlar</h2>
        <p class="mt-1 text-sm text-gray-500">Müşterilerimizin en çok tercih ettiği ürünler</p>
      </div>

      <div class="flex items-center gap-2">
        <a href="/urunler.html?sirala=populer" class="mr-2 hidden items-center gap-1.5 text-xs font-medium hover:text-wood-600 sm:flex">
          Tümünü Gör <i data-lucide="arrow-right" class="size-4"></i>
        </a>
        <button type="button" data-slider-prev aria-label="Önceki ürünler"
                class="grid size-10 place-items-center rounded-full border border-gray-300 bg-white transition hover:border-brand-900 hover:bg-brand-900 hover:text-white disabled:opacity-40">
          <i data-lucide="arrow-left" class="size-4"></i>
        </button>
        <button type="button" data-slider-next aria-label="Sonraki ürünler"
                class="grid size-10 place-items-center rounded-full border border-gray-300 bg-white transition hover:border-brand-900 hover:bg-brand-900 hover:text-white disabled:opacity-40">
          <i data-lucide="arrow-right" class="size-4"></i>
        </button>
      </div>
    </div>

    <!-- Ürünler JS ile doldurulur (src/js/modules/product-slider.js) -->
    <ul data-slider-track
        class="flex snap-x snap-mandatory gap-3 overflow-x-auto scroll-smooth pb-2 [scrollbar-width:none] [&::-webkit-scrollbar]:hidden
               [&>li]:w-[calc((100%_-_0.75rem)/2)] [&>li]:shrink-0 [&>li]:snap-start
               sm:[&>li]:w-[calc((100%_-_1.5rem)/3)] lg:[&>li]:w-[calc((100%_-_2.25rem)/4)] xl:[&>li]:w-[calc((100%_-_3rem)/5)]">
    </ul>

    <div data-slider-dots class="mt-4 flex justify-center gap-2"></div>

    <a href="/urunler.html?sirala=populer" class="mt-4 flex h-10 items-center justify-center gap-1.5 rounded border border-gray-300 text-sm font-medium sm:hidden">
      Tüm Çok Satanlar <i data-lucide="arrow-right" class="size-4"></i>
    </a>
  </div>
</section>
