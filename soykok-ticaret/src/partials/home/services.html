<!-- ================= HİZMET + E-BÜLTEN ŞERİDİ ================= -->
<section class="container-site mt-4" aria-label="Hizmetler ve e-bülten">
  <div class="grid gap-3 md:grid-cols-2 lg:grid-cols-[1fr_1fr_1.15fr]">

    <a href="#" class="group flex gap-4 rounded-md border border-gray-200 bg-gray-50 p-4 transition hover:border-gray-300 hover:bg-white">
      <i data-lucide="swatch-book" class="size-7 shrink-0 text-brand-700"></i>
      <div>
        <h3 class="text-xs font-semibold">Ücretsiz Numune Talebi</h3>
        <p class="mt-0.5 text-[11px] text-gray-500">Parke ve kaplama ürünlerinde ücretsiz numune isteyin.</p>
        <span class="mt-2 inline-flex items-center gap-1.5 text-[11px] font-semibold group-hover:text-wood-600">
          Numune Talep Et <i data-lucide="arrow-right" class="size-3.5 transition group-hover:translate-x-0.5"></i>
        </span>
      </div>
    </a>

    <a href="#" class="group flex gap-4 rounded-md border border-gray-200 bg-gray-50 p-4 transition hover:border-gray-300 hover:bg-white">
      <i data-lucide="building" class="size-7 shrink-0 text-brand-700"></i>
      <div>
        <h3 class="text-xs font-semibold">Proje Bazlı Çözümler</h3>
        <p class="mt-0.5 text-[11px] text-gray-500">Ticari ve konut projeleriniz için özel fiyatlandırma.</p>
        <span class="mt-2 inline-flex items-center gap-1.5 text-[11px] font-semibold group-hover:text-wood-600">
          Proje Teklifi Al <i data-lucide="arrow-right" class="size-3.5 transition group-hover:translate-x-0.5"></i>
        </span>
      </div>
    </a>

    <div class="flex gap-4 rounded-md border border-gray-200 bg-gray-50 p-4 md:col-span-2 lg:col-span-1">
      <i data-lucide="mail" class="size-7 shrink-0 text-brand-700"></i>
      <div class="min-w-0 flex-1">
        <h3 class="text-xs font-semibold">E-Bültenimize Abone Olun</h3>
        <p class="mt-0.5 text-[11px] text-gray-500">Kampanya ve yeniliklerden ilk siz haberdar olun.</p>
        <form data-newsletter class="mt-2 flex gap-2" novalidate>
          <label for="newsletterEmail" class="sr-only">E-posta adresi</label>
          <input id="newsletterEmail" type="email" name="email" required autocomplete="email"
                 placeholder="E-posta adresinizi girin"
                 class="h-9 min-w-0 flex-1 rounded border border-gray-300 bg-white px-3 text-xs placeholder:text-gray-400 focus:border-brand-700 focus:outline-none aria-[invalid=true]:border-sale" />
          <button type="submit" class="h-9 shrink-0 rounded bg-brand-900 px-4 text-xs font-semibold text-white transition hover:bg-brand-700">Abone Ol</button>
        </form>
        <p data-newsletter-msg aria-live="polite" hidden class="mt-1.5 text-[11px]"></p>
      </div>
    </div>

  </div>
</section>
<!-- ================= /HİZMET + E-BÜLTEN ŞERİDİ ================= -->
