<a href="{{href}}" class="group relative block h-36 overflow-hidden rounded-md bg-brand-800 sm:h-40 lg:h-[140px]">
  <img src="/images/categories/{{image}}" alt="" loading="lazy"
       class="absolute inset-0 size-full object-cover transition duration-500 group-hover:scale-105" />
  <div class="absolute inset-0 bg-linear-to-t from-brand-950/85 via-brand-950/30 to-transparent"></div>
  <div class="absolute inset-x-0 bottom-0 flex items-end gap-3 p-4 text-white">
    <div class="min-w-0">
      <h3 class="text-base font-bold">{{title}}</h3>
      <p class="truncate text-[11px] text-white/85">{{text}}</p>
    </div>
    <i data-lucide="arrow-right" class="ml-auto size-4 shrink-0 transition group-hover:translate-x-1"></i>
  </div>
</a>
