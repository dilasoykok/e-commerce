server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # /urunler -> /urunler.html gibi uzantısız adresleri de destekle
    location / {
        try_files $uri $uri.html $uri/ =404;
    }

    # Vite'ın hash'li dosyaları uzun süre önbelleğe alınabilir
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    error_page 404 /index.html;
}
