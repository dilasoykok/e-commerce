name: soykok-ecommerce

services:
  # ---------------------------------------------------------------
  # Reverse proxy — dış dünyaya açılan tek giriş noktası
  # ---------------------------------------------------------------
  nginx:
    image: nginx:1.27-alpine
    container_name: soykok-nginx
    restart: unless-stopped
    ports:
      - "${HTTP_PORT:-80}:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/templates:/etc/nginx/templates:ro
    environment:
      FRONTEND_UPSTREAM: ${FRONTEND_UPSTREAM:-http://frontend:3000}
    extra_hosts:
      # Geliştirmede bilgisayardaki `npm run dev`'e ulaşmak için (Linux'ta da çalışsın)
      - "host.docker.internal:host-gateway"
    # frontend burada yok: geliştirmede Next.js Docker yerine bilgisayarda çalışabilir
    depends_on:
      - api
      - keycloak
      - rabbitmq
    networks:
      - soykok-net

  # ---------------------------------------------------------------
  # Arayüz (soykok-web — Next.js, standalone sunucu)
  # Sunucuda çizilen sayfalar ürünleri doğrudan api servisinden çeker.
  # ---------------------------------------------------------------
  frontend:
    build:
      context: ./soykok-web
      dockerfile: Dockerfile
    image: soykok/frontend:latest
    container_name: soykok-frontend
    restart: unless-stopped
    environment:
      API_URL: http://api:8080/api
      SITE_URL: ${PUBLIC_URL:-http://localhost}
    expose:
      - "3000"
    networks:
      - soykok-net

  # ---------------------------------------------------------------
  # Veritabanı migration'ları — API'den önce çalışır, işi bitince kapanır
  # ---------------------------------------------------------------
  migrator:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: migrator
    image: soykok/migrator:latest
    container_name: soykok-migrator
    restart: "no"
    environment:
      DOTNET_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Development}
      ConnectionStrings__Postgres: Host=postgres;Port=5432;Database=${POSTGRES_DB};Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD};GSS Encryption Mode=Disable
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - soykok-net

  # ---------------------------------------------------------------
  # Backend API — ASP.NET Core (.NET 10), /api altında yayınlanır
  # ---------------------------------------------------------------
  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: api
    image: soykok/api:latest
    container_name: soykok-api
    restart: unless-stopped
    environment:
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Development}
      ConnectionStrings__Postgres: Host=postgres;Port=5432;Database=${POSTGRES_DB};Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD};GSS Encryption Mode=Disable
      ConnectionStrings__Redis: redis:6379,password=${REDIS_PASSWORD},abortConnect=false
      RabbitMQ__Host: rabbitmq
      RabbitMQ__Port: "5672"
      RabbitMQ__Username: ${RABBITMQ_USER}
      RabbitMQ__Password: ${RABBITMQ_PASSWORD}
      RabbitMQ__VirtualHost: ${RABBITMQ_VHOST:-/}
      Keycloak__Authority: ${PUBLIC_URL:-http://localhost}/auth/realms/soykok
      Keycloak__InternalAuthority: http://keycloak:8080/auth/realms/soykok
      Keycloak__Audience: soykok-api
      Keycloak__ClientId: soykok-bff
      Keycloak__ClientSecret: ${KEYCLOAK_BFF_SECRET:-dev-bff-secret-change-me}
      # Kartla ödeme (iyzico). Anahtarlar boşsa kart kapalı, havale çalışır.
      Iyzico__ApiKey: ${IYZICO_API_KEY:-}
      Iyzico__SecretKey: ${IYZICO_SECRET_KEY:-}
      Iyzico__BaseUrl: ${IYZICO_BASE_URL:-https://sandbox-api.iyzipay.com}
      Iyzico__CallbackUrl: ${PUBLIC_URL:-http://localhost}/api/payments/iyzico/callback
    depends_on:
      migrator:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      keycloak:
        condition: service_started
    expose:
      - "8080"
    networks:
      - soykok-net

  # ---------------------------------------------------------------
  # Kimlik doğrulama — Keycloak (/auth altında yayınlanır)
  # ---------------------------------------------------------------
  keycloak:
    image: quay.io/keycloak/keycloak:26.0
    container_name: soykok-keycloak
    restart: unless-stopped
    command: ["start-dev", "--import-realm"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD}
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/${KEYCLOAK_DB_NAME}
      KC_DB_USERNAME: ${KEYCLOAK_DB_USER}
      KC_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD}
      KC_HTTP_ENABLED: "true"
      KC_HTTP_RELATIVE_PATH: /auth
      KC_HOSTNAME: ${PUBLIC_URL:-http://localhost}/auth
      KC_HOSTNAME_STRICT: "false"
      KC_HOSTNAME_BACKCHANNEL_DYNAMIC: "true"   # api servisi Keycloak'a iç ağdan (keycloak:8080) erişebilsin
      KC_PROXY_HEADERS: xforwarded
      KC_HEALTH_ENABLED: "true"
      # realm dosyasındaki ${KEYCLOAK_BFF_SECRET} yer tutucusu bununla doldurulur
      KEYCLOAK_BFF_SECRET: ${KEYCLOAK_BFF_SECRET:-dev-bff-secret-change-me}
    volumes:
      - ./keycloak/import:/opt/keycloak/data/import:ro
    depends_on:
      postgres:
        condition: service_healthy
    expose:
      - "8080"
    networks:
      - soykok-net

  # ---------------------------------------------------------------
  # Veritabanı — PostgreSQL (uygulama + keycloak veritabanları)
  # ---------------------------------------------------------------
  postgres:
    image: postgres:17-alpine
    container_name: soykok-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      KEYCLOAK_DB_NAME: ${KEYCLOAK_DB_NAME}
      KEYCLOAK_DB_USER: ${KEYCLOAK_DB_USER}
      KEYCLOAK_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD}
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - soykok-net

  # ---------------------------------------------------------------
  # Önbellek / oturum — Redis
  # ---------------------------------------------------------------
  redis:
    image: redis:7-alpine
    container_name: soykok-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--requirepass", "${REDIS_PASSWORD}"]
    environment:
      REDISCLI_AUTH: ${REDIS_PASSWORD}
    volumes:
      - redis-data:/data
    ports:
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - soykok-net

  # ---------------------------------------------------------------
  # Mesaj kuyruğu — RabbitMQ (yönetim paneli /rabbitmq altında)
  # ---------------------------------------------------------------
  rabbitmq:
    image: rabbitmq:4-management-alpine
    container_name: soykok-rabbitmq
    restart: unless-stopped
    hostname: soykok-rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD}
      RABBITMQ_DEFAULT_VHOST: ${RABBITMQ_VHOST:-/}
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
      - ./rabbitmq/20-management.conf:/etc/rabbitmq/conf.d/20-management.conf:ro
    ports:
      - "127.0.0.1:${RABBITMQ_PORT:-5672}:5672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 15s
      timeout: 10s
      retries: 10
    networks:
      - soykok-net

volumes:
  postgres-data:
  redis-data:
  rabbitmq-data:

networks:
  soykok-net:
    driver: bridge
