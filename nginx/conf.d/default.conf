# Docker iç DNS'i — servisler sonradan ayağa kalksa bile nginx çökmez
resolver 127.0.0.11 valid=10s ipv6=off;

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    server_name _;

    proxy_http_version 1.1;
    proxy_set_header Host              $http_host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host  $host;
    proxy_set_header X-Forwarded-Port  $server_port;
    proxy_set_header Upgrade           $http_upgrade;
    proxy_set_header Connection        $connection_upgrade;

    # --- Arayüz (soykok-ticaret) ---
    location / {
        set $frontend http://frontend:80;
        proxy_pass $frontend;
    }

    # --- Keycloak (kimlik doğrulama + yönetim konsolu) ---
    location /auth/ {
        set $keycloak http://keycloak:8080;
        proxy_pass $keycloak;
    }

    # --- RabbitMQ yönetim paneli ---
    location /rabbitmq/ {
        set $rabbitmq http://rabbitmq:15672;
        proxy_pass $rabbitmq;
    }

    # --- Backend API (ASP.NET Core) ---
    location /api/ {
        set $api http://api:8080;
        proxy_pass $api;
    }

    location = /nginx-health {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }
}
