# Soykök Ticaret giriş teması (Keycloak klasik temasının üzerine)
# Formların işleyişi parent temadan gelir; görünüm template.ftl + css/soykok.css
parent=keycloak
import=common/keycloak

# PatternFly stilleri yüklenmez, yalnızca kendi CSS'imiz
stylesCommon=
styles=css/soykok.css

# Sitenin adresi ("Siteye dön" bağlantısı). docker-compose'da PUBLIC_URL verilir.
siteUrl=${env.PUBLIC_URL:http://localhost}

# Şifre göster/gizle simgesi (Font Awesome yerine CSS ile çizilir)
kcFormPasswordVisibilityIconShow=sk-eye
kcFormPasswordVisibilityIconHide=sk-eye-off
kcFormPasswordVisibilityButtonClass=sk-reveal
kcInputGroup=sk-input-group
